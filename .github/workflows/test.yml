name: test

on:
  push:
  pull_request:

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The suite ships its own React runtime, DOM and fetch stubs; no install needed.
      - run: node test/harness.mjs
